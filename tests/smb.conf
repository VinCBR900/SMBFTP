; smb.conf - Samba as an SMB1-only (NT1) test server on 127.0.0.1 (test harness only)
; Version : 1.1
; Usage   : smbd -s /home/claude/smbftp_test/smb.conf -F --no-process-group   (see start_servers.sh)
; History : 1.1  state/ncalrpc directories moved under smbftp_test/run (smbd needs a writable pipe dir).
;           1.0  first version.
[global]
  workgroup = WORKGROUP
  netbios name = TESTSRV
  server min protocol = NT1
  server max protocol = NT1
  ntlm auth = yes
  lanman auth = no
  client min protocol = NT1
  map to guest = Bad User
  guest account = root
  security = user
  interfaces = 127.0.0.1
  bind interfaces only = yes
  smb ports = 445 139
  disable netbios = no
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log file = /home/claude/smbftp_test/run/logs/log.%m
  log level = 1
  lock directory = /home/claude/smbftp_test/run/lock
  state directory = /home/claude/smbftp_test/run/state
  cache directory = /home/claude/smbftp_test/run/cache
  pid directory = /home/claude/smbftp_test/run/pid
  private dir = /home/claude/smbftp_test/run/private
  ncalrpc dir = /home/claude/smbftp_test/run/ncalrpc
  winbindd socket directory = /home/claude/smbftp_test/run/winbindd
  ntp signd socket directory = /home/claude/smbftp_test/run/ntp
  unix charset = UTF-8
  dos charset = CP850
  usershare allow guests = no
  server role = standalone server
  allow insecure wide links = yes

[pub]
  path = /home/claude/smbftp_test/share
  read only = no
  guest ok = yes
  force user = root
  create mask = 0666
  directory mask = 0777
