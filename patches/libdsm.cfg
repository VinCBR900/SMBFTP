# Which libdsm to download and patch. Read by build.cmd and by the Makefile
# (KEY=VALUE, no spaces around "=", lines starting with # are comments).
#
# Upstream commit to build (master, 2024-01-04, just after v0.4.3). Always pin a full
# commit id, never a branch or "latest".
LIBDSM_COMMIT=0f3edc6df6ab5950f2550d453035351440f71e31
# Where to download it. The file is cached as deps/libdsm-<commit>.tar.gz.
LIBDSM_URL=https://codeload.github.com/videolabs/libdsm/tar.gz/0f3edc6df6ab5950f2550d453035351440f71e31
# SHA-256 of that download; the build stops if it does not match.
LIBDSM_SHA256=0668d41fce738a0d2cbb7d5ba5b4227756740ebabcf8146bf276c98eec254213
# Patches in this folder, applied in this order (applydiff -p1, inside the libdsm tree).
LIBDSM_PATCHES=0001-tcc-windows-port.diff 0002-v0.6-fixes.diff
